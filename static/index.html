<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vantaggio Pensione Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Dashboard Vantaggio Pensione</h1>
      <p class="subtitle">Simula il capitale pensionistico e genera il report PDF con Gemini.</p>

      <section class="card">
        <form id="simForm">
          <div class="grid">
            <label>Età attuale <input type="number" name="current_age" value="35" min="18" max="75" required /></label>
            <label>Età pensione <input type="number" name="retirement_age" value="67" min="45" max="80" required /></label>
            <label>Contributo mensile (€) <input type="number" name="monthly_contribution" value="350" min="1" step="0.01" required /></label>
            <label>Rendimento annuo (%) <input type="number" name="annual_return_rate" value="4.5" min="0" max="20" step="0.1" required /></label>
            <label>Capitale attuale (€) <input type="number" name="current_capital" value="10000" min="0" step="0.01" /></label>
          </div>
          <div class="actions">
            <button type="submit">Calcola Dashboard</button>
            <button type="button" id="downloadPdf">Scarica Report PDF</button>
          </div>
        </form>
      </section>

      <section class="card metrics">
        <div>
          <h3>Capitale stimato finale</h3>
          <p id="finalCapital">-</p>
        </div>
        <div>
          <h3>Anni alla pensione</h3>
          <p id="yearsLeft">-</p>
        </div>
      </section>

      <section class="card">
        <canvas id="capitalChart" height="110"></canvas>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
